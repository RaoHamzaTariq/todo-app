version: '3.8'

services:
  # ZooKeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - todo-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - todo-network

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: todo-app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  # Dapr Placement Service
  dapr-placement:
    image: daprio/dapr:latest
    container_name: dapr-placement
    command: ["./placement", "-port", "50005"]
    ports:
      - "50005:50005"
    networks:
      - todo-network

  # Dapr Sentry Service (Certificate Authority)
  dapr-sentry:
    image: daprio/dapr:latest
    container_name: dapr-sentry
    command: ["./sentry", "-port", "50000"]
    ports:
      - "50000:50000"
    environment:
      SENTRY_ROOT_CERT_PEM_PATH: /certs/ca.crt
      SENTRY_CERT_PEM_PATH: /certs/issuer.crt
      SENTRY_KEY_PEM_PATH: /certs/issuer.key
    networks:
      - todo-network

  # Dapr Operator Service
  dapr-operator:
    image: daprio/dapr:latest
    container_name: dapr-operator
    command: ["./operator", "-port", "6500"]
    ports:
      - "6500:6500"
    environment:
      KUBERNETES_SERVICE_HOST: ""
      KUBERNETES_SERVICE_PORT: ""
    networks:
      - todo-network

  # Reminder Service (Event-driven)
  reminder-service:
    build:
      context: .
      dockerfile: event-services/reminder-service/Dockerfile
    container_name: reminder-service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/todo_db
      KAFKA_BROKER: kafka:9092
      DAPR_HTTP_ENDPOINT: http://localhost:3500
      DAPR_GRPC_ENDPOINT: grpc://localhost:50001
      ENVIRONMENT: development
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./event-services/reminder-service:/app
      - /app/__pycache__
    networks:
      - todo-network
    command: ["dapr", "run", "--app-id", "reminder-service", "--app-port", "8002", "--dapr-grpc-port", "50002", "python", "src/main.py"]

  # Recurring Task Service (Event-driven)
  recurring-task-service:
    build:
      context: .
      dockerfile: event-services/recurring-task-service/Dockerfile
    container_name: recurring-task-service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/todo_db
      KAFKA_BROKER: kafka:9092
      DAPR_HTTP_ENDPOINT: http://localhost:3500
      DAPR_GRPC_ENDPOINT: grpc://localhost:50001
      ENVIRONMENT: development
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./event-services/recurring-task-service:/app
      - /app/__pycache__
    networks:
      - todo-network
    command: ["dapr", "run", "--app-id", "recurring-task-service", "--app-port", "8003", "--dapr-grpc-port", "50003", "python", "src/main.py"]

  # Audit Log Service (Event-driven)
  audit-log-service:
    build:
      context: .
      dockerfile: event-services/audit-log-service/Dockerfile
    container_name: audit-log-service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/todo_db
      KAFKA_BROKER: kafka:9092
      DAPR_HTTP_ENDPOINT: http://localhost:3500
      DAPR_GRPC_ENDPOINT: grpc://localhost:50001
      ENVIRONMENT: development
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./event-services/audit-log-service:/app
      - /app/__pycache__
    networks:
      - todo-network
    command: ["dapr", "run", "--app-id", "audit-log-service", "--app-port", "8004", "--dapr-grpc-port", "50004", "python", "src/main.py"]

  # Notification Service (Event-driven)
  notification-service:
    build:
      context: .
      dockerfile: event-services/notification-service/Dockerfile
    container_name: notification-service
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/todo_db
      KAFKA_BROKER: kafka:9092
      DAPR_HTTP_ENDPOINT: http://localhost:3500
      DAPR_GRPC_ENDPOINT: grpc://localhost:50001
      ENVIRONMENT: development
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./event-services/notification-service:/app
      - /app/__pycache__
    networks:
      - todo-network
    command: ["dapr", "run", "--app-id", "notification-service", "--app-port", "8005", "--dapr-grpc-port", "50005", "python", "src/main.py"]

  # MCP Server (Model Context Protocol)
  mcp-server:
    build:
      context: .
      dockerfile: backend/Dockerfile.mcp
    container_name: todo-app-mcp-server
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/todo_db
      KAFKA_BROKER: kafka:9092
      DAPR_HTTP_ENDPOINT: http://localhost:3500
      DAPR_GRPC_ENDPOINT: grpc://localhost:50001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-super-secret-key-min-32-chars}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - todo-network
    command: ["dapr", "run", "--app-id", "mcp-server", "--app-port", "8001", "--dapr-grpc-port", "50001", "python", "-m", "src.app.mcp.server"]

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: todo-app-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/todo_db
      MCP_SERVER_URL: http://mcp-server:8001
      KAFKA_BROKER: kafka:9092
      DAPR_HTTP_ENDPOINT: http://localhost:3500
      DAPR_GRPC_ENDPOINT: grpc://localhost:50001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-super-secret-key-min-32-chars}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      mcp-server:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - todo-network
    command: ["dapr", "run", "--app-id", "backend", "--app-port", "8000", "--dapr-grpc-port", "50000", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-app-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MCP_SERVER_URL: http://localhost:8001
      NEXT_PUBLIC_DAPR_HTTP_ENDPOINT: http://localhost:3500
      NEXT_PUBLIC_KAFKA_BROKER: kafka:9092
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-super-secret-key-min-32-chars}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/frontend/node_modules
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  postgres_data: