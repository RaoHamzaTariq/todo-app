# Dapr Sidecar Configuration Template
#
# This template demonstrates how to configure Dapr sidecars for different services
# in the Todo Chatbot application. Use this as a starting point and customize
# for your specific environment (Minikube vs Oracle OKE).

---
# Example Deployment with Dapr Sidecar for Todo Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  labels:
    app: todo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
      annotations:
        # Dapr annotations - required for sidecar injection
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-frontend"
        dapr.io/app-port: "3000"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"

        # Resource limits for the Dapr sidecar
        dapr.io/sidecar-cpu-limit: "0.5"
        dapr.io/sidecar-cpu-request: "0.2"
        dapr.io/sidecar-memory-limit: "512Mi"
        dapr.io/sidecar-memory-request: "256Mi"

        # Enable API logging for debugging
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: frontend
        image: todo-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DAPR_HOST
          value: "localhost"
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: DAPR_GRPC_PORT
          value: "50001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# Example Service for Todo Frontend
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  labels:
    app: todo-frontend
spec:
  type: ClusterIP
  selector:
    app: todo-frontend
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: dapr-http
    port: 3500
    targetPort: 3500
  - name: dapr-grpc
    port: 50001
    targetPort: 50001

---
# Example Deployment with Dapr Sidecar for Todo Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app: todo-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
      annotations:
        # Dapr annotations
        dapr.io/enabled: "true"
        dapr.io/app-id: "todo-backend"
        dapr.io/app-port: "8000"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"

        # Resource limits for the Dapr sidecar
        dapr.io/sidecar-cpu-limit: "0.5"
        dapr.io/sidecar-cpu-request: "0.2"
        dapr.io/sidecar-memory-limit: "512Mi"
        dapr.io/sidecar-memory-request: "256Mi"

        # Enable API logging for debugging
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: backend
        image: todo-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-connection-string
              key: url
        - name: BETTER_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: better-auth-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"

---
# Example Service for Todo Backend
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  labels:
    app: todo-backend
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: dapr-http
    port: 3500
    targetPort: 3500
  - name: dapr-grpc
    port: 50001
    targetPort: 50001

---
# Example Deployment with Dapr Sidecar for MCP Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
      annotations:
        # Dapr annotations
        dapr.io/enabled: "true"
        dapr.io/app-id: "mcp-server"
        dapr.io/app-port: "8080"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"

        # Resource limits for the Dapr sidecar
        dapr.io/sidecar-cpu-limit: "0.3"
        dapr.io/sidecar-cpu-request: "0.1"
        dapr.io/sidecar-memory-limit: "256Mi"
        dapr.io/sidecar-memory-request: "128Mi"

        # Enable API logging for debugging
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: mcp-server
        image: mcp-server:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# Example Service for MCP Server
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  type: ClusterIP
  selector:
    app: mcp-server
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: dapr-http
    port: 3500
    targetPort: 3500
  - name: dapr-grpc
    port: 50001
    targetPort: 50001

---
# Dapr Configuration for Tracing and Metrics
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.default.svc.cluster.local:9411/api/v2/spans"
  metric:
    enabled: true
  httpPipeline:
    handlers: []
  grpcPipeline:
    handlers: []
  accessControl:
    defaultAction: allow
    trustDomain: "todo-chatbot"
    policies:
    - appId: "todo-frontend"
      defaultAction: allow
      trustDomain: "todo-chatbot"
      namespace: "default"
      rules:
      - name: frontend-to-backend
        verb: "POST,PUT,GET,DELETE"
        protocol: "http"
        port: "8000"
        action: "allow"
    - appId: "todo-backend"
      defaultAction: allow
      trustDomain: "todo-chatbot"
      namespace: "default"
      rules:
      - name: backend-to-mcp
        verb: "POST,GET"
        protocol: "http"
        port: "8080"
        action: "allow"