apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-log-service
  labels:
    app: audit-log-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-log-service
  template:
    metadata:
      labels:
        app: audit-log-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "audit-log-service"
        dapr.io/app-port: "8003"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"
        dapr.io/app-protocol: "http"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
        dapr.io/enable-tracing: "true"
        dapr.io/sidecar-listen-addresses: "0.0.0.0"
    spec:
      containers:
      - name: audit-log-service
        image: audit-log-service:latest
        ports:
        - containerPort: 8003
        env:
        - name: DAPR_SIDECAR_HOST
          value: "localhost"
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: DAPR_GRPC_PORT
          value: "50001"
        - name: KAFKA_BROKER
          value: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
        - name: LOG_FILE_PATH
          value: "/logs/audit.log"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: audit-log-service
  labels:
    app: audit-log-service
spec:
  selector:
    app: audit-log-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
  type: ClusterIP