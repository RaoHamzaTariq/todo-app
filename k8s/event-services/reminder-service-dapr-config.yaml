apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-service
  labels:
    app: reminder-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-service
  template:
    metadata:
      labels:
        app: reminder-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "reminder-service"
        dapr.io/app-port: "8002"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"
        dapr.io/app-protocol: "http"
        dapr.io/enable-metrics: "true"
        dapr.io/enable-tracing: "true"
    spec:
      containers:
      - name: reminder-service
        image: reminder-service:latest
        ports:
        - containerPort: 8002
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: url
        - name: KAFKA_BROKER
          value: "kafka:9092"
        - name: DAPR_HTTP_ENDPOINT
          value: "http://localhost:3500"
        - name: DAPR_GRPC_ENDPOINT
          value: "grpc://localhost:50001"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-service
  labels:
    app: reminder-service
spec:
  selector:
    app: reminder-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8002
  type: ClusterIP