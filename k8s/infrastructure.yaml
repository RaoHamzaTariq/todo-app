apiVersion: v1
kind: Namespace
metadata:
  name: todo-app
---
# Dapr Configuration
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: todo-app
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.todo-app.svc.cluster.local:9411/api/v2/spans"
  metric:
    enabled: true
  httpPipeline:
    handlers: []
  accessControl:
    defaultAction: allow
    trustDomain: "pubsub-domain"
    policies:
    - appId: "backend"
      defaultAction: allow
      namespace: "todo-app"
      rules:
      - name: allow-backend-to-all
        match:
          operation: "*"
          httpVerb: ["*"]
        action: allow
    - appId: "reminder-service"
      defaultAction: allow
      namespace: "todo-app"
      rules:
      - name: allow-reminder-to-backend
        match:
          operation: "*"
          httpVerb: ["GET", "POST"]
        action: allow
    - appId: "recurring-task-service"
      defaultAction: allow
      namespace: "todo-app"
      rules:
      - name: allow-recurring-to-backend
        match:
          operation: "*"
          httpVerb: ["GET", "POST"]
        action: allow
    - appId: "audit-log-service"
      defaultAction: allow
      namespace: "todo-app"
      rules:
      - name: allow-audit-to-all
        match:
          operation: "*"
          httpVerb: ["POST"]
        action: allow
---
# Kafka Configuration using Strimzi
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: todo-kafka
  namespace: todo-app
spec:
  kafka:
    version: 3.7.0
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.7"
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: false
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 5Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# PostgreSQL State Store Component for Dapr
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: postgres-statestore
  namespace: todo-app
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    value: "postgresql://postgres:your_secure_password@supabase-host:5432/todo_db?sslmode=require"
  - name: actorStateStore
    value: "true"
---
# Kafka Pub/Sub Component for Dapr
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: todo-app
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "todo-kafka-kafka-brokers:9092"
  - name: consumerGroup
    value: "dapr-consumer-group"
  - name: clientID
    value: "dapr-kafka-client"
  - name: authRequired
    value: "false"