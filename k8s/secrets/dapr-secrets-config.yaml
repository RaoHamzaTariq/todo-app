# Dapr Secret Store Configuration
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secret-store
  namespace: default
spec:
  type: secretstores.kubernetes
  version: v1
  metadata: []

---
# Kubernetes Secret for Database Credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: default
type: Opaque
data:
  # This would typically contain base64 encoded secrets
  # Example values (these would be replaced with actual secrets in production)
  username: cG9zdGdyZXM=  # postgres (base64)
  password: cGFzc3dvcmQxMjM=  # password123 (base64)
  host: cG9zdGdyZXFsLWRi # postgresql-db (base64)
  database: dG9kb2FwcA==  # todoapp (base64)
  url: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBhc3N3b3JkMTIzQHBvc3RncmVzLTE1OjU0MzIvdG9kb2FwcA==  # postgresql://postgres:password123@postgresql-15:5432/todoapp (base64)

---
# Dapr Component for PostgreSQL State Store with Secret Reference
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: postgresql-state
  namespace: default
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: postgresql-secret
      key: url
  - name: versionColumnType
    value: "dapr_version"
  - name: valueColumnName
    value: "dapr_value"
  - name: keyColumnName
    value: "dapr_key"
  - name: tableName
    value: "dapr_store"
auth:
  secretStore: secret-store