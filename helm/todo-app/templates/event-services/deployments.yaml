{{- if .Values.eventServices.reminderService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-app.reminder-service.fullname" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: reminder-service
spec:
  replicas: {{ .Values.eventServices.reminderService.replicaCount }}
  selector:
    matchLabels:
      {{- include "todo-app.selectorLabels" . | nindent 6 }}
      app: reminder-service
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "reminder-service"
        dapr.io/app-port: "8002"
        dapr.io/config: "dapr-config"
        dapr.io/log-level: "info"
        dapr.io/app-protocol: "http"
        dapr.io/enable-metrics: "true"
        dapr.io/enable-tracing: "true"
        {{- with .Values.eventServices.reminderService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "todo-app.selectorLabels" . | nindent 8 }}
        app: reminder-service
    spec:
      {{- with .Values.eventServices.reminderService.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "todo-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.eventServices.reminderService.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-reminder-service
          securityContext:
            {{- toYaml .Values.eventServices.reminderService.securityContext | nindent 12 }}
          image: "{{ .Values.eventServices.reminderService.image.repository }}:{{ .Values.eventServices.reminderService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.eventServices.reminderService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ .Values.eventServices.reminderService.env.DATABASE_URL | quote }}
            - name: KAFKA_BROKER
              value: {{ .Values.eventServices.reminderService.env.KAFKA_BROKER | quote }}
            - name: DAPR_HTTP_ENDPOINT
              value: {{ .Values.eventServices.reminderService.env.DAPR_HTTP_ENDPOINT | quote }}
            - name: DAPR_GRPC_ENDPOINT
              value: {{ .Values.eventServices.reminderService.env.DAPR_GRPC_ENDPOINT | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.eventServices.reminderService.env.ENVIRONMENT | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.eventServices.reminderService.resources | nindent 12 }}
          {{- with .Values.eventServices.reminderService.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.eventServices.reminderService.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventServices.reminderService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventServices.reminderService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventServices.reminderService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.reminder-service.fullname" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: reminder-service
spec:
  type: {{ .Values.eventServices.reminderService.service.type }}
  ports:
    - port: {{ .Values.eventServices.reminderService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "todo-app.selectorLabels" . | nindent 4 }}
    app: reminder-service
{{- end }}

