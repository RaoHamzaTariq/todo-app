apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-app.audit-log-service.fullname" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: audit-log-service
spec:
  {{- if not .Values.eventServices.auditLog.autoscaling.enabled }}
  replicas: {{ .Values.eventServices.auditLog.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "todo-app.selectorLabels" . | nindent 6 }}
      app: audit-log-service
  template:
    metadata:
      annotations:
        {{- if .Values.dapr.enabled }}
        dapr.io/enabled: "true"
        dapr.io/app-id: "{{ .Values.dapr.auditLogService.appId }}"
        dapr.io/app-port: "{{ .Values.dapr.auditLogService.appPort }}"
        dapr.io/config: "{{ .Values.dapr.config }}"
        dapr.io/log-as-json: "true"
        {{- end }}
        {{- with .Values.eventServices.auditLog.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "todo-app.selectorLabels" . | nindent 8 }}
        app: audit-log-service
    spec:
      {{- with .Values.eventServices.auditLog.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "todo-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.eventServices.auditLog.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-audit-log-service
          securityContext:
            {{- toYaml .Values.eventServices.auditLog.securityContext | nindent 12 }}
          image: "{{ .Values.eventServices.auditLog.image.repository }}:{{ .Values.eventServices.auditLog.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.eventServices.auditLog.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.eventServices.auditLog.service.port }}
              protocol: TCP
          {{- if .Values.dapr.enabled }}
          env:
            - name: DAPR_HTTP_ENDPOINT
              value: "http://localhost:3500"
            - name: DAPR_GRPC_ENDPOINT
              value: "http://localhost:50001"
            - name: KAFKA_BROKER
              value: {{ .Values.kafka.broker | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: "audit-log-consumer-group"
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.eventServices.auditLog.resources | nindent 12 }}
      {{- with .Values.eventServices.auditLog.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventServices.auditLog.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.eventServices.auditLog.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}