apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.recurring-task-service.fullname" . }}
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
    app: recurring-task-service
spec:
  type: {{ .Values.eventServices.recurringTask.service.type }}
  ports:
    - port: {{ .Values.eventServices.recurringTask.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "todo-app.selectorLabels" . | nindent 4 }}
    app: recurring-task-service