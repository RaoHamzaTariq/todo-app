{{- if .Values.global.supabase.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: supabase-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  database-url: {{ .Values.global.supabase.databaseUrl | b64enc | quote }}
  anon-key: {{ .Values.global.supabase.anonKey | b64enc | quote }}
  service-role-key: {{ .Values.global.supabase.serviceRoleKey | b64enc | quote }}
{{- end }}

{{- if .Values.global.auth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  secret: {{ .Values.global.auth.secret | b64enc | quote }}
{{- end }}

{{- if .Values.global.kafka.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  broker: {{ .Values.global.kafka.broker | b64enc | quote }}
{{- end }}