# Default values for todo-app

# Enable Dapr sidecar injection
dapr:
  enabled: true
  # Dapr runtime configuration
  runtime:
    enabled: true
    version: "1.13.0"

# Kafka configuration
kafka:
  enabled: true
  # Kafka chart values
  auth:
    enabled: false
  replicaCount: 1
  zookeeper:
    enabled: true

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    username: "postgres"
    password: "postgres"
    database: "todo_db"

# Backend service configuration
backend:
  replicaCount: 1
  image:
    repository: todo-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgresql:5432/todo_db"
    MCP_SERVER_URL: "http://mcp-server:8001"
    KAFKA_BROKER: "kafka:9092"
    DAPR_HTTP_ENDPOINT: "http://localhost:3500"
    DAPR_GRPC_ENDPOINT: "grpc://localhost:50001"
    BETTER_AUTH_SECRET: "your-super-secret-key-min-32-chars"
    JWT_ALGORITHM: "HS256"
    ENVIRONMENT: "production"

# Frontend service configuration
frontend:
  replicaCount: 1
  image:
    repository: todo-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: LoadBalancer
    port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    NEXT_PUBLIC_API_URL: "http://backend:80"
    NEXT_PUBLIC_MCP_SERVER_URL: "http://mcp-server:80"
    NEXT_PUBLIC_DAPR_HTTP_ENDPOINT: "http://localhost:3500"
    NEXT_PUBLIC_KAFKA_BROKER: "kafka:9092"
    BETTER_AUTH_SECRET: "your-super-secret-key-min-32-chars"

# MCP Server configuration
mcpServer:
  replicaCount: 1
  image:
    repository: mcp-server
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 150m
      memory: 128Mi
  env:
    DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgresql:5432/todo_db"
    KAFKA_BROKER: "kafka:9092"
    DAPR_HTTP_ENDPOINT: "http://localhost:3500"
    DAPR_GRPC_ENDPOINT: "grpc://localhost:50001"
    BETTER_AUTH_SECRET: "your-super-secret-key-min-32-chars"
    JWT_ALGORITHM: "HS256"
    ENVIRONMENT: "production"

# Event services configurations
eventServices:
  # Reminder Service
  reminderService:
    enabled: true
    replicaCount: 1
    image:
      repository: reminder-service
      pullPolicy: IfNotPresent
      tag: "latest"
    service:
      type: ClusterIP
      port: 80
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgresql:5432/todo_db"
      KAFKA_BROKER: "kafka:9092"
      DAPR_HTTP_ENDPOINT: "http://localhost:3500"
      DAPR_GRPC_ENDPOINT: "grpc://localhost:50001"
      ENVIRONMENT: "production"

  # Recurring Task Service
  recurringTaskService:
    enabled: true
    replicaCount: 1
    image:
      repository: recurring-task-service
      pullPolicy: IfNotPresent
      tag: "latest"
    service:
      type: ClusterIP
      port: 80
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgresql:5432/todo_db"
      KAFKA_BROKER: "kafka:9092"
      DAPR_HTTP_ENDPOINT: "http://localhost:3500"
      DAPR_GRPC_ENDPOINT: "grpc://localhost:50001"
      ENVIRONMENT: "production"

  # Audit Log Service
  auditLogService:
    enabled: true
    replicaCount: 1
    image:
      repository: audit-log-service
      pullPolicy: IfNotPresent
      tag: "latest"
    service:
      type: ClusterIP
      port: 80
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgresql:5432/todo_db"
      KAFKA_BROKER: "kafka:9092"
      DAPR_HTTP_ENDPOINT: "http://localhost:3500"
      DAPR_GRPC_ENDPOINT: "grpc://localhost:50001"
      ENVIRONMENT: "production"

  # Notification Service
  notificationService:
    enabled: true
    replicaCount: 1
    image:
      repository: notification-service
      pullPolicy: IfNotPresent
      tag: "latest"
    service:
      type: ClusterIP
      port: 80
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgresql:5432/todo_db"
      KAFKA_BROKER: "kafka:9092"
      DAPR_HTTP_ENDPOINT: "http://localhost:3500"
      DAPR_GRPC_ENDPOINT: "grpc://localhost:50001"
      ENVIRONMENT: "production"

# Dapr component configurations
daprComponents:
  kafkaPubSub:
    enabled: true
    brokers: "kafka:9092"
    consumerGroup: "dapr-consumer-group"
    clientID: "dapr-kafka-client"
    authRequired: false
  
  postgresStateStore:
    enabled: true
    connectionString: "postgresql://postgres:postgres@postgresql:5432/todo_db?sslmode=disable"
    actorStateStore: true

  cronBinding:
    enabled: true
    schedule: "@every 30s"

  kubernetesSecretStore:
    enabled: true